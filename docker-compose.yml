# Orquestração da aplicação + banco de dados

services:
  # Banco de dados MySQL
  mysql:
    image: mysql:8.0
    container_name: image_classification_db
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app_network
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 3s
      timeout: 10s
      retries: 10
      start_period: 30s

  # Aplicação FastAPI
  app:
    build: .
    container_name: image_classification_app
    environment:
      - ENV=${ENV:-development}
      - DATABASE_URL=${DATABASE_URL}
      - API_HOST=${API_HOST}
      - API_PORT=${API_PORT}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      - ADMIN_NOME_COMPLETO=${ADMIN_NOME_COMPLETO}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_SENHA=${ADMIN_SENHA}
      - ADMIN_CPF=${ADMIN_CPF}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ALGORITHM=${JWT_ALGORITHM}
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=${JWT_ACCESS_TOKEN_EXPIRE_MINUTES}
      - COOKIE_NAME=${COOKIE_NAME:-access_token}
      - COOKIE_HTTPONLY=${COOKIE_HTTPONLY:-true}
      - COOKIE_SAMESITE=${COOKIE_SAMESITE:-lax}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN:-}
      - TIMEZONE=${TIMEZONE:-America/Sao_Paulo}
      - NEXTCLOUD_BASE_URL=${NEXTCLOUD_BASE_URL}
      - NEXTCLOUD_USERNAME=${NEXTCLOUD_USERNAME}
      - NEXTCLOUD_PASSWORD=${NEXTCLOUD_PASSWORD}
      - NEXTCLOUD_WEBDAV_PATH=${NEXTCLOUD_WEBDAV_PATH}
      - NEXTCLOUD_USER_PATH=${NEXTCLOUD_USER_PATH}
      - NEXTCLOUD_MAX_PAGE_SIZE=${NEXTCLOUD_MAX_PAGE_SIZE}
      - NEXTCLOUD_VERIFY_SSL=${NEXTCLOUD_VERIFY_SSL}
      - NEXTCLOUD_SYNC_ACTIVITY_API_INTERVAL=${NEXTCLOUD_SYNC_ACTIVITY_API_INTERVAL}
      - NEXTCLOUD_SYNC_WEBDAV_INTERVAL=${NEXTCLOUD_SYNC_WEBDAV_INTERVAL}
      - NEXTCLOUD_SYNC_INITIAL_ON_STARTUP=${NEXTCLOUD_SYNC_INITIAL_ON_STARTUP}
      - NEXTCLOUD_SYNC_MAX_RETRIES=${NEXTCLOUD_SYNC_MAX_RETRIES}
      - NEXTCLOUD_SYNC_RETRY_DELAY=${NEXTCLOUD_SYNC_RETRY_DELAY}
      - NEXTCLOUD_SYNC_BATCH_SIZE=${NEXTCLOUD_SYNC_BATCH_SIZE}
    ports:
      - "8000:8000"
    volumes:
      - ./images:/app/images
      - ./app:/app/app
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  mysql_data:

networks:
  app_network:
    driver: bridge
